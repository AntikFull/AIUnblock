name: Публикация подписанного APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация release APK
    runs-on: ubuntu-latest
    env:
      APK_NAME: ru.ecubz.aiunblock-7-0.1.6-release.apk

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-37
            build-tools;37.0.0
            ndk;28.1.13356709

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-configuration-cache

      - name: Подписать APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          unsigned="app/build/outputs/apk/release/ru.ecubz.aiunblock-7-0.1.6-release-unsigned.apk"
          signed="app/build/outputs/apk/release/$APK_NAME"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release-key.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --min-sdk-version 26 \
            --out "$signed" \
            "$unsigned"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$signed"

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v0.1.6-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "app/build/outputs/apk/release/$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI Unblock $tag" \
            --generate-notes
